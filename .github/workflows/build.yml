name: Build and Cache

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # The update bot merges with GITHUB_TOKEN, which never triggers a push
  # build, so rebuild main hourly to keep the cache warm. A run with nothing
  # new only substitutes from the cache.
  schedule:
    - cron: '30 * * * *'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - uses: cachix/cachix-action@v15
      with:
        name: nkl-nix-config
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        skipPush: ${{ github.event_name == 'pull_request' }}

    - name: Build gemini-cli
      run: |
        nix build .#gemini-cli
        nix build .#default
        # The cachix-action will automatically push the built derivations
